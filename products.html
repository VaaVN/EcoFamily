<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="icon" href="assets/img/Favicon.png" type="image/png" />
    <title>Эко-семья - Товар</title>
  </head>
  <body>
    <main>
      <div class="firstFrame">
        <div
          style="
            background-image: url(&quot;assets/img/titleProducts.svg&quot;);
          "
          class="titleFrame"
        >
          <div class="titleText">
            <h1>Наши</h1>
            <h1 style="text-align: center">Товары</h1>
          </div>
          <div class="titleAbout">
            <p>
              Мы&nbsp;предлагаем большое количество <br />
              экологически чистых и&nbsp;безопасных <br />
              игрушек для детей.
            </p>
            <button class="blue" role="link" data-href="/aboutUs.html">
              <h3>Подробнее</h3>
            </button>
          </div>
        </div>
      </div>
      <div class="secondFrame">
        <div class="infoBlock">
          <h2 style="color: #3d46a5">Товары</h2>
          <div class="productsRoller">
            <a class="card" data-js="productCard" href="products.html"
              ><img src="assets\img\toyCard.png"
            /></a>
            <a class="card" data-js="productCard" href="products.html"
              ><img src="assets\img\toyCard2.png"
            /></a>
            <a class="card" data-js="productCard" href="products.html"
              ><img src="assets\img\toyCard.png"
            /></a>
            <a class="card" data-js="productCard" href="products.html"
              ><img src="assets\img\toyCard2.png"
            /></a>
            <a class="card" data-js="productCard" href="products.html"
              ><img src="assets\img\toyCard.png"
            /></a>
            <a class="card" data-js="productCard" href="products.html"
              ><img src="assets\img\toyCard2.png"
            /></a>
            <a class="card" data-js="productCard" href="products.html"
              ><img src="assets\img\toyCard.png"
            /></a>
          </div>
        </div>
        <div class="infoBlock">
          <h2 style="color: #3d46a5">Игрушки</h2>
          <div class="productsTab">
            <a class="product1" href="/horse.html"
              ><img class="product1" src="assets/img/prod1.svg" alt=""
            /></a>
            <a class="product2" href="/doll.html"
              ><img class="product1" src="assets/img/prod2.svg" alt=""
            /></a>
          </div>
        </div>
        <div class="infoBlock">
          <h2 style="color: #3d46a5">Ваш товар</h2>
          <div class="formMessage">
            <h2>Сотрудничество</h2>
            <p>
              Хочешь продавать у&nbsp;нас свой экологичный товар? Напиши нам!
            </p>
            <div class="formButtons">
              <input type="text" placeholder="ivanivanov@yandex.ru" />
              <button class="yellow" role="link" data-href="/form.html">
                <h3>Подписаться</h3>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
    <script src="./scripts/main.js"></script>
    <script src="./scripts/productCards.js"></script>
  </body>
</html>
